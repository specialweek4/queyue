# ============================================================
# 雀跃后端示例配置
# 使用说明：复制本文件为 application.yaml 并填入你自己的
# MySQL / Redis 连接信息后即可运行（application.yaml 已被 .gitignore 忽略）
# ============================================================
server:
  port: 8081
spring:
  application:
    name: queyue
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qupingque?useSSL=false&serverTimezone=UTC
    username: root
    password: 你的MySQL密码
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 你的Redis密码
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.specialweek
logging:
  level:
    com.specialweek: debug
